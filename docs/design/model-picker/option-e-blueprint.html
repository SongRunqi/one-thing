<!DOCTYPE html>
<html lang="zh-CN" data-scheme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 E · 图纸原生 Blueprint Model Selector</title>
<!--
  方案 E「图纸原生 Blueprint」— 与当前 InputBox 同一视觉语言的 model selector
  依据(逐项对照 InputBox.vue / ModelSelector.vue 现有实现):
    · composer:透明底 + 1px 硬轮廓 border-strong 52%,radius 4px(--radius-xs),
      顶部 mono 框签 COMPOSER(9px/600/2px 字距,chat 底色切断轮廓),聚焦转 accent。
    · 工具条:min-height 34,满宽单元格 + hairline 分隔(border-strong 30%),
      model 格 = 纯 mono 文本 11.5px/600(无 provider 图标),hover 整格填充。
    · 现有 dropdown 行:名称 12/600 + id 10.5 muted,ctx 章 mono 10/650。
  本方案:flyout 锚定 composer-anchor 顶边(与 Dock/Flyout 同一锚),left:0/right:0
    与 composer 同宽;面板复用蓝图框 + MODEL 框签;provider 是一行 mono 分段单元格;
    模型行沿用现有 dropdown 字号,能力徽章沿用 .model-badge 几何(1px 5px/r5/10px 650)
    但按能力着色、flex-wrap 换行 — 不遮挡不溢出(替换掉现有 max-width:128px overflow:hidden)。
  接入:替换 ModelSelector.vue 的 Select 为此 flyout(渲染进 composer-anchor,
    与 QueuePanel/附件 flyout 同层);数据走 settingsStore。
  主题:全部 --ui-* token;:root 为 Flexoki 深/浅演示值,接入后删除即继承系统主题。
-->
<style>
:root{
  color-scheme:dark;
  --ui-surface-app-bg:#282726;
  --ui-surface-chat-bg:#282726;
  --ui-surface-panel-bg:#343331;
  --ui-surface-elevated-bg:#403E3C;
  --ui-text-primary-fg:#F2F0E5;
  --ui-text-secondary-fg:#E6E4D9;
  --ui-text-muted-fg:#CECDC3;
  --ui-text-faint-fg:#B7B5AC;
  --ui-accent-primary-fg:#4385BE;
  --ui-border-strong-border:#6F6E69;
  --ui-border-subtle-border:#403E3C;
  --ui-state-hover-bg:rgba(255,255,255,.04);
  --ui-state-active-bg:rgba(255,255,255,.08);
  --ui-state-selected-bg:rgba(67,133,190,.15);
  --ui-status-success-fg:#879A39;
  --ui-status-warning-fg:#DA702C;
  --ui-status-danger-fg:#D14D41;
  --ui-status-info-fg:#3AA99F;
  --cap-purple:#8B7EC8;
  --shadow-elevated:0 8px 32px rgba(0,0,0,.4);
  --radius-xs:4px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB",sans-serif;
  --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
:root[data-scheme="light"]{
  color-scheme:light;
  --ui-surface-app-bg:#E6E4D9;
  --ui-surface-chat-bg:#E6E4D9;
  --ui-surface-panel-bg:#DAD8CE;
  --ui-surface-elevated-bg:#CECDC3;
  --ui-text-primary-fg:#1C1B1A;
  --ui-text-secondary-fg:#282726;
  --ui-text-muted-fg:#403E3C;
  --ui-text-faint-fg:#575653;
  --ui-accent-primary-fg:#205EA6;
  --ui-border-strong-border:#9F9D96;
  --ui-border-subtle-border:#CECDC3;
  --ui-state-hover-bg:rgba(0,0,0,.04);
  --ui-state-active-bg:rgba(0,0,0,.06);
  --ui-state-selected-bg:rgba(32,94,166,.1);
  --ui-status-success-fg:#66800B;
  --ui-status-warning-fg:#BC5215;
  --ui-status-danger-fg:#AF3029;
  --ui-status-info-fg:#24837B;
  --cap-purple:#5E409D;
  --shadow-elevated:0 8px 32px rgba(16,15,15,.12);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ui-surface-chat-bg);color:var(--ui-text-primary-fg);font-family:var(--font-ui);-webkit-font-smoothing:antialiased}
.demo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;font-size:12px;color:var(--ui-text-faint-fg);letter-spacing:.02em;flex-wrap:wrap}
.ctl{display:flex;align-items:center;gap:6px}
.ctl .wl{font-size:11px;margin-right:2px}
.demo-bar button{font:inherit;font-size:11px;color:var(--ui-text-muted-fg);background:transparent;border:1px solid var(--ui-border-subtle-border);border-radius:999px;padding:4px 10px;cursor:pointer}
.demo-bar button:hover{background:var(--ui-state-hover-bg)}
.demo-bar button.on{color:var(--ui-text-primary-fg);border-color:var(--ui-border-strong-border);background:var(--ui-state-hover-bg)}
.demo-stage{flex:1;display:flex;justify-content:center;padding:24px 24px 56px}
:focus-visible{outline:2px solid var(--ui-accent-primary-fg);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* provider 色(仅用于能力徽章/极小点缀;蓝图语言里 provider 不上 logo) */
.pv-claude{--pv:var(--ui-status-warning-fg)}
.pv-codex{--pv:var(--ui-status-info-fg)}
.pv-deepseek{--pv:var(--ui-accent-primary-fg)}
.pv-gemini{--pv:var(--cap-purple)}
.pv-kimi{--pv:var(--ui-status-danger-fg)}

/* ═══════════ 复刻:composer 蓝图框 ═══════════ */
.workbench{width:736px;max-width:100%;display:flex;flex-direction:column;justify-content:flex-end;transition:width .18s ease}
.mock-chat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:26px;min-height:200px}
.mock-bubble{border-radius:8px;height:16px;opacity:.5}
.mock-bubble.user{width:38%;align-self:flex-end;background:var(--ui-surface-elevated-bg)}
.mock-bubble.ai{width:56%;background:var(--ui-state-active-bg)}

.composer-anchor{position:relative;width:100%;
  --composer-border:color-mix(in srgb,var(--ui-border-strong-border) 52%,transparent);
  --cell-divider:color-mix(in srgb,var(--ui-border-strong-border) 30%,transparent);
}
.composer{
  position:relative;z-index:1;display:flex;flex-direction:column;
  border-radius:var(--radius-xs);
  border:1px solid var(--composer-border);
  background:transparent;
  transition:border-color .2s ease,box-shadow .2s ease;
}
.composer.focused{
  border-color:var(--ui-accent-primary-fg);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--ui-accent-primary-fg) 28%,transparent);
}
.frame-label{
  position:absolute;top:-7px;left:12px;z-index:2;padding:0 6px;
  background:var(--ui-surface-chat-bg);
  font:600 9px/1.5 var(--font-mono);letter-spacing:2px;
  color:var(--ui-text-faint-fg);
  pointer-events:none;user-select:none;
}
.composer.focused>.frame-label{color:var(--ui-accent-primary-fg)}
.input-area{padding:11px 12px 9px;min-height:42px;font-size:14px;color:var(--ui-text-faint-fg)}

/* 复刻:分段状态线工具条 */
.composer-toolbar{
  display:flex;justify-content:space-between;align-items:stretch;
  min-height:34px;margin-top:2px;border-top:1px solid var(--composer-border);
  user-select:none;
}
.toolbar-left{display:flex;align-items:stretch;flex:1;min-width:0;overflow:hidden}
.toolbar-left>*{display:flex;align-items:stretch;flex-shrink:0;border-right:1px solid var(--cell-divider)}
.toolbar-right{display:flex;align-items:stretch;flex-shrink:0}
.toolbar-right>*{border-left:1px solid var(--cell-divider)}
.cell{
  display:inline-flex;align-items:center;gap:7px;height:100%;
  padding:0 11px;border:0;background:transparent;cursor:pointer;
  font:600 11.5px/1 var(--font-mono);color:var(--ui-text-muted-fg);
  transition:color .16s ease,background .16s ease;white-space:nowrap;
}
.cell:hover,.cell.is-open{background:var(--ui-state-hover-bg);color:var(--ui-text-primary-fg)}
.cell .caret{font-size:8px;color:var(--ui-text-faint-fg)}
.ctx-cells i{font-style:normal;color:var(--ui-accent-primary-fg);letter-spacing:1px}
.ctx-cells em{font-style:normal;color:var(--ui-text-faint-fg);letter-spacing:1px}
.send-cell{color:var(--ui-accent-primary-fg);letter-spacing:1px}
.send-cell:hover{color:var(--ui-accent-primary-fg)}

/* ═══════════ MODEL flyout:同一蓝图语言 ═══════════ */
.flyout{
  position:absolute;bottom:calc(100% + 13px);left:0;right:0;z-index:5;
  background:var(--ui-surface-chat-bg);
  border:1px solid var(--composer-border);
  border-radius:var(--radius-xs);
  box-shadow:var(--shadow-elevated);
  display:flex;flex-direction:column;
  transform-origin:bottom left;
  animation:pop .14s cubic-bezier(.32,.72,0,1);
}
.flyout[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.995)}to{opacity:1;transform:none}}
.flyout>.frame-label{color:var(--ui-accent-primary-fg)}

/* 搜索行:与 input-area 同质感,hairline 收底 */
.search-row{
  display:flex;align-items:center;gap:8px;
  padding:9px 12px;border-bottom:1px solid var(--cell-divider);
}
.search-row .pfx{font:600 10px/1 var(--font-mono);color:var(--ui-text-faint-fg);letter-spacing:1px}
.search-row input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--ui-text-primary-fg);font:400 13px/1.4 var(--font-ui);
}
.search-row input::placeholder{color:var(--ui-text-faint-fg)}
.search-row kbd{
  font:500 9px/1 var(--font-mono);color:var(--ui-text-faint-fg);
  border:1px solid var(--ui-border-subtle-border);border-bottom-width:2px;
  border-radius:3px;padding:1px 4px;background:var(--ui-state-hover-bg);
}

/* provider 分段行:与工具条同构 — mono 单元格 + hairline 分隔 */
.pv-row{
  display:flex;align-items:stretch;min-height:30px;
  border-bottom:1px solid var(--cell-divider);
  overflow-x:auto;scrollbar-width:none;
}
.pv-row::-webkit-scrollbar{display:none}
.pv-cell{
  display:inline-flex;align-items:center;flex-shrink:0;
  padding:0 11px;border:0;border-right:1px solid var(--cell-divider);
  background:transparent;cursor:pointer;
  font:600 10px/1 var(--font-mono);letter-spacing:1.2px;
  color:var(--ui-text-muted-fg);
  transition:color .16s ease,background .16s ease;
}
.pv-cell:hover{background:var(--ui-state-hover-bg);color:var(--ui-text-primary-fg)}
.pv-cell.on{background:var(--ui-state-hover-bg);color:var(--ui-accent-primary-fg)}
.pv-cell .n{margin-left:6px;color:var(--ui-text-faint-fg);letter-spacing:0}
.pv-count{
  margin-left:auto;display:inline-flex;align-items:center;flex-shrink:0;
  padding:0 11px;border-left:1px solid var(--cell-divider);
  font:600 10px/1 var(--font-mono);letter-spacing:.5px;color:var(--ui-text-faint-fg);
}

/* 模型列表:行字号沿用现有 model-select-dropdown */
.list{max-height:312px;overflow-y:auto;padding:4px}
.group-lab{
  display:flex;align-items:center;gap:8px;
  padding:8px 8px 4px;
  font:600 9px/1 var(--font-mono);letter-spacing:1.6px;text-transform:uppercase;
  color:var(--ui-text-faint-fg);
}
.group-lab .rule{flex:1;height:1px;background:var(--cell-divider)}
.row{padding:6px 8px;border-radius:var(--radius-xs);cursor:pointer}
.row.focused{background:var(--ui-state-hover-bg)}
.row.current{background:var(--ui-state-selected-bg)}
.row.current.focused{background:color-mix(in srgb,var(--ui-state-selected-bg) 80%,var(--ui-state-active-bg))}
.row .top{display:flex;align-items:baseline;gap:6px}
.row .ck{width:12px;font-size:11px;color:var(--ui-accent-primary-fg);visibility:hidden;flex-shrink:0;align-self:center}
.row.current .ck{visibility:visible}
.row .nm{font-size:12px;font-weight:600;color:var(--ui-text-primary-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .mid{min-width:0;font-size:10.5px;color:var(--ui-text-muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ctx{
  margin-left:auto;flex-shrink:0;
  padding:1px 5px;border-radius:5px;
  font:650 10px/1.4 var(--font-mono);
  color:var(--ui-text-muted-fg);background:var(--ui-state-hover-bg);
}
/* 能力徽章:沿用现有 .model-badge 几何(1px 5px / r5 / 10px 650),
   改为按能力着色 + flex-wrap 换行 — 替换现有 max-width:128px 截断 */
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 1px 18px}
/* 能力徽章统一 accent 单色(用户反馈:分色太杂) */
.badge{
  flex:0 0 auto;padding:1px 5px;border-radius:5px;white-space:nowrap;
  font-size:10px;font-weight:650;line-height:1.4;
  color:var(--ui-accent-primary-fg);
  background:color-mix(in srgb,var(--ui-accent-primary-fg) 12%,transparent);
}
mark{background:transparent;color:var(--ui-accent-primary-fg);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.empty{padding:22px 0;text-align:center;font:600 10px/1 var(--font-mono);letter-spacing:1px;color:var(--ui-text-faint-fg)}

/* 底部状态线:与工具条同构 */
.flyout-foot{
  display:flex;align-items:stretch;min-height:28px;
  border-top:1px solid var(--cell-divider);
  font:600 10px/1 var(--font-mono);color:var(--ui-text-faint-fg);
}
.flyout-foot .fcell{display:inline-flex;align-items:center;gap:5px;padding:0 11px;border-right:1px solid var(--cell-divider)}
.flyout-foot .fcur{margin-left:auto;display:inline-flex;align-items:center;padding:0 11px;border-left:1px solid var(--cell-divider);letter-spacing:.5px}
.flyout-foot .fcur b{color:var(--ui-text-muted-fg);font-weight:600;margin-left:5px}
.flyout-foot kbd{
  font:500 9px/1 var(--font-mono);color:var(--ui-text-faint-fg);
  border:1px solid var(--ui-border-subtle-border);border-bottom-width:2px;
  border-radius:3px;padding:1px 4px;background:var(--ui-state-hover-bg);
}
</style>
</head>
<body>
<div class="demo-bar">
  <span>方案 E · 图纸原生 Blueprint — 与当前 composer 同一语言:框签 / hairline 分段 / mono 标注</span>
  <span class="ctl">
    <span class="wl">输入框宽度</span>
    <button class="wbtn" data-w="360">360</button>
    <button class="wbtn" data-w="560">560</button>
    <button class="wbtn on" data-w="736">736</button>
    <button id="schemeToggle">切换浅色</button>
  </span>
</div>
<div class="demo-stage">
  <div class="workbench">
    <div class="mock-chat">
      <div class="mock-bubble user"></div>
      <div class="mock-bubble ai"></div>
      <div class="mock-bubble user"></div>
    </div>
    <div class="composer-anchor">
      <!-- MODEL flyout:锚定 composer 顶边,同宽 -->
      <div class="flyout" id="pop">
        <span class="frame-label">MODEL</span>
        <div class="search-row">
          <span class="pfx">/</span>
          <input id="q" type="text" placeholder="Search models…" autocomplete="off">
          <kbd>esc</kbd>
        </div>
        <div class="pv-row" id="pvrow"></div>
        <div class="list" id="list"></div>
        <div class="flyout-foot">
          <span class="fcell"><kbd>↑↓</kbd><kbd>↵</kbd><kbd>⇥</kbd></span>
          <span class="fcur" id="fcur"></span>
        </div>
      </div>
      <div class="composer focused" id="composer">
        <span class="frame-label">COMPOSER</span>
        <div class="input-area">Ask anything…</div>
        <div class="composer-toolbar">
          <div class="toolbar-left">
            <button class="cell is-open" id="modelCell" aria-expanded="true"></button>
            <button class="cell ctx-meter"><span>ctx</span><span class="ctx-cells"><i>▮▮▮▮</i><em>▯▯▯▯▯▯</em></span><span>37%</span></button>
            <button class="cell">think:high</button>
            <button class="cell">mode:ask</button>
          </div>
          <div class="toolbar-right">
            <button class="cell">VOICE</button>
            <button class="cell send-cell">SEND ↵</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const PROVIDERS=[
 {id:'claude',name:'Claude',models:[
  {id:'claude-fable-5',name:'Fable 5',ctx:200000,caps:['tools','reasoning','vision']},
  {id:'claude-opus-4-8',name:'Opus 4.8',ctx:200000,caps:['tools','reasoning','vision']},
  {id:'claude-sonnet-5',name:'Sonnet 5',ctx:1000000,caps:['tools','reasoning','vision','speed']},
  {id:'claude-haiku-4-5',name:'Haiku 4.5',ctx:200000,caps:['tools','vision','speed']}]},
 {id:'codex',name:'Codex',models:[
  {id:'gpt-5.2',name:'GPT-5.2',ctx:400000,caps:['tools','reasoning','vision','image']},
  {id:'gpt-5.2-codex',name:'GPT-5.2 Codex',ctx:400000,caps:['tools','reasoning']},
  {id:'gpt-5-mini',name:'GPT-5 mini',ctx:272000,caps:['tools','vision','speed']}]},
 {id:'deepseek',name:'DeepSeek',models:[
  {id:'deepseek-chat',name:'DeepSeek Chat',ctx:128000,caps:['tools','speed']},
  {id:'deepseek-reasoner',name:'DeepSeek Reasoner',ctx:128000,caps:['reasoning']}]},
 {id:'gemini',name:'Gemini',models:[
  {id:'gemini-3-pro',name:'Gemini 3 Pro',ctx:1048576,caps:['tools','reasoning','vision','image']},
  {id:'gemini-3-flash',name:'Gemini 3 Flash',ctx:1048576,caps:['tools','vision','speed']}]},
 {id:'kimi',name:'Kimi',models:[
  {id:'kimi-k2',name:'Kimi K2',ctx:262144,caps:['tools','speed']}]},
];
const CAPS={
 tools:{label:'Tools',c:'var(--ui-accent-primary-fg)'},
 reasoning:{label:'Reasoning',c:'var(--cap-purple)'},
 vision:{label:'Image in',c:'var(--ui-status-info-fg)'},
 image:{label:'Image out',c:'var(--ui-status-success-fg)'},
 speed:{label:'Fast',c:'var(--ui-status-warning-fg)'},
};
const badgesOf=m=>`<div class="badges">${m.caps.map(c=>`<span class="badge">${CAPS[c].label}</span>`).join('')}</div>`;
let CURRENT={provider:'claude',model:'claude-fable-5'};
let filter='all',query='',focusIdx=0,flat=[];

const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtCtx=n=>!n?'':n>=1e6?(Math.round(n/1e5)/10).toFixed(n%1e6?1:0).replace(/\.0$/,'')+'M':Math.round(n/1000)+'K';
function hl(text){
  if(!query)return esc(text);
  const i=text.toLowerCase().indexOf(query.toLowerCase());
  if(i<0)return esc(text);
  return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+query.length))+'</mark>'+esc(text.slice(i+query.length));
}
function groups(){
  const q=query.toLowerCase();
  return PROVIDERS
    .filter(p=>filter==='all'||p.id===filter)
    .map(p=>({p,models:p.models.filter(m=>!q||m.name.toLowerCase().includes(q)||m.id.toLowerCase().includes(q)||p.name.toLowerCase().includes(q))}))
    .filter(g=>g.models.length);
}
function renderPvRow(){
  const items=[{id:'all',name:'ALL',n:PROVIDERS.reduce((s,p)=>s+p.models.length,0)}]
    .concat(PROVIDERS.map(p=>({id:p.id,name:p.name.toUpperCase(),n:p.models.length})));
  $('#pvrow').innerHTML=items.map(c=>
    `<button class="pv-cell ${filter===c.id?'on':''}" data-f="${c.id}">${c.name}<span class="n">${c.n}</span></button>`).join('')+
    `<span class="pv-count">${flat.length} MODELS</span>`;
  document.querySelectorAll('.pv-cell').forEach(el=>el.addEventListener('click',()=>{filter=el.dataset.f;focusIdx=0;render();$('#q').focus();}));
}
function render(){
  const gs=groups();
  flat=gs.flatMap(g=>g.models.map(m=>({p:g.p,m})));
  focusIdx=Math.max(0,Math.min(focusIdx,flat.length-1));
  let i=0;
  $('#list').innerHTML=flat.length===0?'<div class="empty">NO MODELS FOUND</div>':gs.map(g=>
    (filter==='all'?`<div class="group-lab"><span>${esc(g.p.name)}</span><span class="rule"></span></div>`:'')+
    g.models.map(m=>{
      const idx=i++;
      const cur=CURRENT.provider===g.p.id&&CURRENT.model===m.id;
      return `<div class="row ${cur?'current':''} ${idx===focusIdx?'focused':''}" data-i="${idx}">
        <div class="top"><span class="ck">✓</span><span class="nm">${hl(m.name)}</span><span class="mid">${hl(m.id)}</span><span class="ctx">${fmtCtx(m.ctx)}</span></div>
        ${badgesOf(m)}
      </div>`;
    }).join('')).join('');
  document.querySelectorAll('.row').forEach(el=>{
    el.addEventListener('click',()=>select(+el.dataset.i));
    el.addEventListener('mouseenter',()=>{focusIdx=+el.dataset.i;paint();});
  });
  renderPvRow();
  renderFoot();
}
function paint(){document.querySelectorAll('.row').forEach(el=>el.classList.toggle('focused',+el.dataset.i===focusIdx));}
function renderFoot(){
  const p=PROVIDERS.find(x=>x.id===CURRENT.provider);
  const m=p.models.find(x=>x.id===CURRENT.model);
  $('#fcur').innerHTML=`CURRENT<b>${m.id} · ${fmtCtx(m.ctx)}</b>`;
}
function select(i){
  const it=flat[i];if(!it)return;
  CURRENT={provider:it.p.id,model:it.m.id};
  renderCell();render();closePop();
  /* 实际接入:emit('select', provider, model) */
}
function renderCell(){
  const p=PROVIDERS.find(x=>x.id===CURRENT.provider);
  const m=p.models.find(x=>x.id===CURRENT.model);
  $('#modelCell').innerHTML=`${m.name}<span class="caret">▴</span>`;
  $('#modelCell').title=`${p.name} · ${m.id}`;
}
function closePop(){
  $('#pop').hidden=true;
  $('#modelCell').classList.remove('is-open');
  $('#modelCell').setAttribute('aria-expanded','false');
  $('#modelCell').querySelector('.caret').textContent='▴';
}
function openPop(){
  $('#pop').hidden=false;
  $('#modelCell').classList.add('is-open');
  $('#modelCell').setAttribute('aria-expanded','true');
  query='';$('#q').value='';filter='all';
  focusIdx=PROVIDERS.flatMap(p=>p.models.map(m=>({p,m}))).findIndex(x=>x.p.id===CURRENT.provider&&x.m.id===CURRENT.model);
  render();$('#q').focus();
}
$('#q').addEventListener('input',e=>{query=e.target.value;focusIdx=0;render();});
document.addEventListener('keydown',e=>{
  if($('#pop').hidden)return;
  if(e.key==='ArrowDown'){e.preventDefault();focusIdx=Math.min(focusIdx+1,flat.length-1);paint();scrollFocus();}
  else if(e.key==='ArrowUp'){e.preventDefault();focusIdx=Math.max(focusIdx-1,0);paint();scrollFocus();}
  else if(e.key==='Enter'){select(focusIdx);}
  else if(e.key==='Escape'){closePop();}
  else if(e.key==='Tab'){
    e.preventDefault();
    const order=['all'].concat(PROVIDERS.map(p=>p.id));
    filter=order[(order.indexOf(filter)+(e.shiftKey?order.length-1:1))%order.length];
    focusIdx=0;render();
  }
});
function scrollFocus(){const el=document.querySelector('.row.focused');if(el)el.scrollIntoView({block:'nearest'});}
$('#modelCell').addEventListener('click',()=>{$('#pop').hidden?openPop():closePop();});
document.addEventListener('click',e=>{
  if(!e.target.closest('.flyout')&&!e.target.closest('#modelCell'))closePop();
});
document.querySelectorAll('.wbtn').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.wbtn').forEach(x=>x.classList.toggle('on',x===b));
  document.querySelector('.workbench').style.width=b.dataset.w+'px';
}));
const root=document.documentElement,tg=$('#schemeToggle');
tg.addEventListener('click',()=>{
  const light=root.dataset.scheme==='light';
  root.dataset.scheme=light?'dark':'light';
  tg.textContent=light?'切换浅色':'切换深色';
});
renderCell();openPop();
</script>
</body>
</html>
