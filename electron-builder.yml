appId: com.onething.app
productName: onething
# castlabs electron 的版本号 41.1.1+wvcus 让 node-abi 解析失败;native 模块
# (better-sqlite3/node-pty/sherpa) 已按该 electron 的 ABI 编好(dev 实机在跑),
# 打包直接带现有 .node,跳过 rebuild。
npmRebuild: false
nodeGypRebuild: false
# castlabs electron(41.1.1+wvcus)不在官方下载源;直接用本地安装的 dist。
electronDist: node_modules/electron/dist
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
  # Exclude unnecessary files from node_modules
  - "!**/{CHANGELOG.md,README.md,readme.md,LICENSE,license,License}"
  - "!**/*.{d.ts,map,ts.map}"
  - "!**/test{,s}/**"
  - "!**/.{eslint,prettier,github,vscode}*"
  # onnxruntime-web is not needed in Electron main process
  - "!node_modules/onnxruntime-web"
  # Font packages are bundled by Vite into renderer, no need in asar
  - "!node_modules/@fontsource-variable"
  - "!node_modules/lxgw-wenkai-webfont"
  - "!node_modules/lxgw-wenkai-screen-webfont"

# Native sherpa-onnx addon and its dylibs must stay on disk (loaded via
# process dlopen; the darwin package already carries an @loader_path rpath).
asarUnpack:
  - "**/node_modules/sherpa-onnx-node/**"
  - "**/node_modules/sherpa-onnx-darwin-arm64/**"
  - "**/node_modules/sherpa-onnx-darwin-x64/**"
  - "**/node_modules/sherpa-onnx-linux-x64/**"
  - "**/node_modules/sherpa-onnx-linux-arm64/**"
  - "**/node_modules/sherpa-onnx-win-x64/**"
  # node-pty ships a native addon plus a `spawn-helper` binary it execs; neither
  # can be loaded or run from inside the asar archive.
  - "**/node_modules/node-pty/**"

# Extra resources to include (copied to resources/ in the app bundle)
extraResources:
  - from: resources/templates
    to: templates
    filter:
      - "**/*"
  - from: resources/docs
    to: docs
    filter:
      - "**/*"
  - from: resources/skills
    to: skills
    filter:
      - "**/*"
  - from: resources/native
    to: native
    filter:
      - "**/*"
  - from: resources/models
    to: models
    filter:
      - "**/*"

win:
  target:
    - nsis
    - portable

mac:
  extendInfo:
    NSMicrophoneUsageDescription: onething uses the microphone only when Voice is enabled or when you click the microphone button.
  target:
    - dmg
    - zip

linux:
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
